[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mind76line-disttrain_jd002"
version = "0.1.0"
description = "从样本里推断分布式训练框架工程师·显存碎片与分配策略应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mind76line" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mind76line.github.io"
Repository = "https://github.com/mind76line/disttrain_jd002"
Issues = "https://github.com/mind76line/disttrain_jd002/issues"

[project.scripts]
disttrain_jd002 = "disttrain_jd002:main"

[tool.setuptools]
py-modules = ["disttrain_jd002"]
